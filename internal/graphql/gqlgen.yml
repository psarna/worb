schema:
  - schema.graphqls

exec:
  filename: generated.go
  package: graphql

model:
  filename: models_gen.go
  package: graphql

resolver:
  layout: follow-schema
  dir: .
  package: graphql
  filename_template: "{name}.resolvers.go"

models:
  JSONString:
    model:
      - github.com/99designs/gqlgen/graphql.String
  Project:
    fields:
      bucket:
        resolver: true
      run:
        resolver: true
      runs:
        resolver: true
      runCount:
        resolver: true
  Run:
    fields:
      wandbConfig:
        resolver: true
