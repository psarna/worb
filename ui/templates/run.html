<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Run.DisplayName}}{{.Run.DisplayName}}{{else}}{{.Run.Name}}{{end}} - worb</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/worb.svg">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/" style="color: inherit;"><img src="/static/worb.svg" alt="" width="28" height="28" style="vertical-align: -4px; margin-right: 6px;"><span>worb</span></a></h1>
            <a href="https://github.com/psarna/worb" style="color: var(--text-secondary); display: flex;" title="GitHub"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
        </div>
    </header>
    <div class="container">
        <div class="breadcrumb" style="display: flex; align-items: center; justify-content: space-between;">
            <div>
                <a href="/">Projects</a>
                <span>/</span>
                <a href="/projects/{{.Project.ID}}">{{.Project.Name}}</a>
                <span>/</span>
                <span style="color: var(--text);">{{if .Run.DisplayName}}{{.Run.DisplayName}}{{else}}{{.Run.Name}}{{end}}</span>
            </div>
            <button id="history-toggle-btn" class="wrap-toggle" style="display:none;" onclick="toggleHistoryView()">show latest</button>
        </div>

        <div class="run-header">
            <h2 style="margin-bottom: 0;">{{if .Run.DisplayName}}{{.Run.DisplayName}}{{else}}{{.Run.Name}}{{end}}</h2>
            <span class="badge {{.Run.State}}">{{.Run.State}}</span>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="charts">Charts</div>
            <div class="tab" data-tab="config">Config</div>
            <div class="tab" data-tab="summary">Summary</div>
            <div class="tab" data-tab="logs">Logs</div>
            <div class="tab" data-tab="console">Console</div>
        </div>

        <div id="charts" class="tab-content active">
            <div id="chart-grid"></div>
            <div class="empty-state" id="no-charts" style="display:none;">No metrics logged yet.</div>
        </div>

        <div id="config" class="tab-content">
            <table class="config-table" id="config-table">
                <tbody></tbody>
            </table>
        </div>

        <div id="summary" class="tab-content">
            <table class="config-table" id="summary-table">
                <tbody></tbody>
            </table>
        </div>

        <div id="logs" class="tab-content">
            <div class="logs-container" id="logs-container">Loading...</div>
        </div>

        <div id="console" class="tab-content">
            <div class="console-container">
                <div class="console-editor">
                    <div class="sql-editor-wrap">
                        <pre id="sql-highlight" aria-hidden="true"></pre>
                        <textarea id="sql-input" spellcheck="false">-- engine: {{.DBEngine}}
SELECT step, data FROM history
WHERE run_id = '{{.Run.ID}}'
ORDER BY step LIMIT 20</textarea>
                    </div>
                    <div class="console-actions">
                        <button id="run-query-btn" onclick="runQuery()">Run Query</button>
                        <span id="query-status" class="query-status"></span>
                        <button id="wrap-toggle-btn" class="wrap-toggle" onclick="toggleWrap()">wrap text</button>
                    </div>
                </div>
                <div id="query-results" class="query-results"></div>
            </div>
        </div>
    </div>

    <script>
    const runID = "{{.Run.ID}}";
    const runState = "{{.Run.State}}";
    const runHistoryLineCount = {{.Run.HistoryLineCount}};

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
        });
    });

    const barLabelPlugin = {
        id: 'barLabel',
        afterDatasetsDraw(chart) {
            const { ctx } = chart;
            chart.data.datasets.forEach((ds, i) => {
                const meta = chart.getDatasetMeta(i);
                meta.data.forEach((bar, idx) => {
                    const val = ds.data[idx];
                    if (val == null) return;
                    const text = Number.isInteger(val) ? String(val) : val.toFixed(4);
                    ctx.save();
                    ctx.fillStyle = '#e6edf3';
                    ctx.font = 'bold 13px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, bar.x, bar.y + (bar.height || 0) / 2);
                    ctx.restore();
                });
            });
        }
    };

    const allCharts = {};
    const everyChart = new Set();
    let syncing = false;

    function syncZoom(source, min, max) {
        if (syncing) return;
        syncing = true;
        for (const c of everyChart) {
            const btn = c.canvas.closest('.chart-container')?.querySelector('.zoom-reset-btn');
            if (btn) btn.style.display = 'inline-block';
            if (c === source) continue;
            if (c.resetZoom) c.zoomScale('x', {min, max}, 'none');
        }
        syncing = false;
    }

    function resetAllZoom() {
        for (const c of everyChart) {
            if (c.options.scales?.x) {
                c.options.scales.x.min = undefined;
                c.options.scales.x.max = undefined;
            }
            c.update('none');
            const btn = c.canvas.closest('.chart-container')?.querySelector('.zoom-reset-btn');
            if (btn) btn.style.display = 'none';
        }
    }

    let expandedOverlay = null;

    function expandChart(key) {
        if (expandedOverlay) return;
        const src = allCharts[key];
        if (!src) return;

        const overlay = document.createElement('div');
        overlay.className = 'chart-overlay';

        const container = document.createElement('div');
        container.className = 'chart-container';
        container.innerHTML = `<div class="chart-header"><div class="chart-title">${key}</div><button class="zoom-reset-btn" style="display:none;" title="Reset zoom">Reset</button></div><canvas></canvas>`;
        overlay.appendChild(container);
        document.body.appendChild(overlay);
        expandedOverlay = overlay;

        const isBar = src.config.type === 'bar';
        const data = JSON.parse(JSON.stringify(src.data));
        const resetBtn = container.querySelector('.zoom-reset-btn');

        const expandedChart = new Chart(container.querySelector('canvas'), isBar ? {
            type: 'bar',
            data: data,
            plugins: [barLabelPlugin],
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.y}` } },
                },
                scales: {
                    x: { display: false },
                    y: { beginAtZero: true, title: { display: true, text: key, color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
                },
                animation: false,
            }
        } : {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    zoom: {
                        zoom: {
                            drag: {
                                enabled: true,
                                backgroundColor: 'rgba(88,166,255,0.15)',
                                borderColor: '#58a6ff',
                                borderWidth: 1,
                            },
                            mode: 'x',
                            onZoomComplete: () => { resetBtn.style.display = 'inline-block'; },
                        },
                    },
                },
                scales: {
                    x: { title: { display: true, text: 'step', color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
                    y: { title: { display: true, text: key, color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
                },
                animation: false,
            }
        });

        everyChart.add(expandedChart);

        if (!isBar && src.scales && src.scales.x) {
            const srcX = src.scales.x;
            const fullMin = src.data.labels[0];
            const fullMax = src.data.labels[src.data.labels.length - 1];
            if (srcX.min !== fullMin || srcX.max !== fullMax) {
                expandedChart.zoomScale('x', { min: srcX.min, max: srcX.max }, 'none');
                resetBtn.style.display = 'inline-block';
            }
        }

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetAllZoom();
        });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                everyChart.delete(expandedChart);
                expandedChart.destroy();
                overlay.remove();
                expandedOverlay = null;
            }
        });
    }

    function createChart(grid, key, points) {
        const singleValue = points.length === 1;
        const div = document.createElement('div');
        div.className = 'chart-container';
        div.id = 'cc-' + key.replace(/[^a-zA-Z0-9]/g, '_');
        div.innerHTML = `<div class="chart-header"><div class="chart-title">${key}</div><button class="zoom-reset-btn" style="display:none;" title="Reset zoom">Reset</button></div><canvas></canvas>`;
        grid.appendChild(div);

        const resetBtn = div.querySelector('.zoom-reset-btn');

        const chartConfig = singleValue ? {
            type: 'bar',
            data: {
                labels: [key.split('/').pop().split('-').pop()],
                datasets: [{
                    label: key,
                    data: [points[0].value],
                    backgroundColor: 'rgba(88,166,255,0.6)',
                    borderColor: '#58a6ff',
                    borderWidth: 1,
                    barPercentage: 0.4,
                }]
            },
            plugins: [barLabelPlugin],
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.y}` } },
                },
                scales: {
                    x: { display: false },
                    y: { beginAtZero: true, title: { display: true, text: key, color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
                },
                animation: false,
            }
        } : {
            type: 'line',
            data: {
                labels: points.map(p => p.step),
                datasets: [{
                    label: key,
                    data: points.map(p => p.value),
                    borderColor: '#58a6ff',
                    backgroundColor: 'rgba(88,166,255,0.1)',
                    borderWidth: 1.5,
                    pointRadius: points.length < 3 ? 3 : 0,
                    tension: 0.1,
                    fill: true,
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    zoom: {
                        zoom: {
                            drag: {
                                enabled: true,
                                backgroundColor: 'rgba(88,166,255,0.15)',
                                borderColor: '#58a6ff',
                                borderWidth: 1,
                            },
                            mode: 'x',
                            onZoomComplete: ({chart: zoomedChart}) => {
                                const {min, max} = zoomedChart.scales.x;
                                syncZoom(zoomedChart, min, max);
                            },
                        },
                    },
                },
                scales: {
                    x: { title: { display: true, text: 'step', color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
                    y: { title: { display: true, text: key, color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
                },
                animation: false,
            }
        };

        const chart = new Chart(div.querySelector('canvas'), chartConfig);
        everyChart.add(chart);

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetAllZoom();
        });

        let mouseDownPos = null;
        div.addEventListener('mousedown', (e) => { mouseDownPos = { x: e.clientX, y: e.clientY }; });
        div.addEventListener('click', (e) => {
            if (!mouseDownPos) return;
            const dx = e.clientX - mouseDownPos.x;
            const dy = e.clientY - mouseDownPos.y;
            if (dx * dx + dy * dy < 25) expandChart(key);
            mouseDownPos = null;
        });

        return chart;
    }

    const CACHE_PREFIX = 'worb_history_';
    const MAX_CACHE_ENTRIES = 20;

    function getCachedHistory(id) {
        try {
            const raw = localStorage.getItem(CACHE_PREFIX + id);
            if (!raw) return null;
            return JSON.parse(raw);
        } catch { return null; }
    }

    function setCachedHistory(id, lineCount, ndjsonText) {
        try {
            evictOldCacheEntries();
            localStorage.setItem(CACHE_PREFIX + id, JSON.stringify({
                lineCount: lineCount,
                ts: Date.now(),
                data: ndjsonText,
            }));
        } catch {}
    }

    function evictOldCacheEntries() {
        const entries = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith(CACHE_PREFIX)) {
                try {
                    const val = JSON.parse(localStorage.getItem(key));
                    entries.push({ key, ts: val.ts || 0 });
                } catch { entries.push({ key, ts: 0 }); }
            }
        }
        entries.sort((a, b) => a.ts - b.ts);
        while (entries.length >= MAX_CACHE_ENTRIES) {
            localStorage.removeItem(entries.shift().key);
        }
    }

    let showHistory = true;
    let hasCollapsible = false;
    let _rerenderAll = null;

    function toggleHistoryView() {
        showHistory = !showHistory;
        const btn = document.getElementById('history-toggle-btn');
        btn.textContent = showHistory ? 'show latest' : 'show history';
        if (_rerenderAll) _rerenderAll();
    }

    async function loadCharts() {
        const grid = document.getElementById('chart-grid');
        const metrics = {};
        let renderPending = false;

        function dedupeSorted(points) {
            const allSameStep = points.length > 1 && points.every(p => p.step === points[0].step);
            if (allSameStep && showHistory) {
                const sorted = [...points].sort((a, b) => a.index - b.index);
                return sorted.map((p, i) => ({ step: i, value: p.value }));
            }
            const byStep = new Map();
            for (const p of points) byStep.set(p.step, p.value);
            return Array.from(byStep, ([step, value]) => ({ step, value }))
                .sort((a, b) => a.step - b.step);
        }

        function destroyAll() {
            for (const key of Object.keys(allCharts)) {
                everyChart.delete(allCharts[key]);
                allCharts[key].destroy();
                delete allCharts[key];
            }
            grid.innerHTML = '';
            for (const key of Object.keys(categoryElements)) delete categoryElements[key];
        }

        const collapsedCategories = new Set();
        const categoryElements = {};

        function getCategoryAndMetric(key) {
            const idx = key.indexOf('/');
            if (idx === -1) return ['Charts', key];
            return [key.substring(0, idx), key];
        }

        function toggleCategory(cat) {
            const el = categoryElements[cat];
            if (!el) return;
            if (collapsedCategories.has(cat)) {
                collapsedCategories.delete(cat);
                el.header.classList.remove('collapsed');
                el.charts.classList.remove('hidden');
            } else {
                collapsedCategories.add(cat);
                el.header.classList.add('collapsed');
                el.charts.classList.add('hidden');
            }
        }

        function ensureCategory(cat, count) {
            if (categoryElements[cat]) {
                categoryElements[cat].countEl.textContent = count;
                return categoryElements[cat];
            }
            const section = document.createElement('div');
            section.className = 'category-section';
            section.dataset.cat = cat;
            const header = document.createElement('div');
            header.className = 'category-header' + (collapsedCategories.has(cat) ? ' collapsed' : '');
            header.innerHTML = `<svg class="category-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg><span class="category-name">${cat}</span><span class="category-count">${count}</span>`;
            header.addEventListener('click', () => toggleCategory(cat));
            const chartsDiv = document.createElement('div');
            chartsDiv.className = 'category-charts' + (collapsedCategories.has(cat) ? ' hidden' : '');
            section.appendChild(header);
            section.appendChild(chartsDiv);
            grid.appendChild(section);
            categoryElements[cat] = { section, header, charts: chartsDiv, countEl: header.querySelector('.category-count') };
            return categoryElements[cat];
        }

        function render() {
            const sortedKeys = Object.keys(metrics).sort();
            const categories = {};
            for (const key of sortedKeys) {
                const [cat] = getCategoryAndMetric(key);
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(key);
            }

            const catOrder = Object.keys(categories).sort((a, b) => {
                if (a === 'Charts') return -1;
                if (b === 'Charts') return 1;
                return a.localeCompare(b);
            });

            for (const cat of catOrder) {
                const keys = categories[cat];
                const catEl = ensureCategory(cat, keys.length);
                for (const key of keys) {
                    const points = dedupeSorted(metrics[key]);
                    const needsBar = points.length === 1;
                    if (allCharts[key]) {
                        const isBar = allCharts[key].config.type === 'bar';
                        if (isBar !== needsBar) {
                            const oldDiv = allCharts[key].canvas.closest('.chart-container');
                            everyChart.delete(allCharts[key]);
                            allCharts[key].destroy();
                            if (oldDiv) oldDiv.remove();
                            allCharts[key] = createChart(catEl.charts, key, points);
                        } else {
                            allCharts[key].data.labels = needsBar ? [key.split('/').pop().split('-').pop()] : points.map(p => p.step);
                            allCharts[key].data.datasets[0].data = points.map(p => p.value);
                            allCharts[key].update('none');
                        }
                    } else {
                        allCharts[key] = createChart(catEl.charts, key, points);
                    }
                    const div = allCharts[key]?.canvas?.closest('.chart-container');
                    if (div) catEl.charts.appendChild(div);
                }
            }

            if (!hasCollapsible) {
                for (const key of sortedKeys) {
                    const pts = metrics[key];
                    if (pts && pts.length > 1 && pts.every(p => p.step === pts[0].step)) {
                        hasCollapsible = true;
                        document.getElementById('history-toggle-btn').style.display = '';
                        break;
                    }
                }
            }
        }

        function scheduleRender() {
            if (renderPending) return;
            renderPending = true;
            requestAnimationFrame(() => {
                renderPending = false;
                render();
            });
        }

        _rerenderAll = function() {
            destroyAll();
            render();
        };

        function parseNdjson(text) {
            for (const line of text.split('\n')) {
                if (!line) continue;
                const p = JSON.parse(line);
                if (!metrics[p.k]) metrics[p.k] = [];
                metrics[p.k].push({ step: p.s, value: p.v, index: p.i });
            }
        }

        const cached = getCachedHistory(runID);
        if (cached) {
            parseNdjson(cached.data);
            scheduleRender();
        }

        const resp = await fetch(`/api/runs/${runID}/history`);
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullText = '';
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            fullText += chunk;
            buffer += chunk;
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
                if (!line) continue;
                const p = JSON.parse(line);
                if (!metrics[p.k]) metrics[p.k] = [];
                metrics[p.k].push({ step: p.s, value: p.v, index: p.i });
            }
            scheduleRender();
        }
        if (buffer.trim()) {
            fullText += '\n';
            const p = JSON.parse(buffer);
            if (!metrics[p.k]) metrics[p.k] = [];
            metrics[p.k].push({ step: p.s, value: p.v, index: p.i });
            scheduleRender();
        }
        setCachedHistory(runID, runHistoryLineCount, fullText);

        if (Object.keys(metrics).length === 0) {
            document.getElementById('no-charts').style.display = 'block';
        }
    }

    function renderTable(tableId, obj) {
        const tbody = document.querySelector(`#${tableId} tbody`);
        if (!obj || Object.keys(obj).length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="color: var(--text-secondary); text-align: center;">Empty</td></tr>';
            return;
        }
        Object.keys(obj).sort().forEach(key => {
            const tr = document.createElement('tr');
            let val = obj[key];
            if (typeof val === 'object') val = JSON.stringify(val);
            tr.innerHTML = `<th>${key}</th><td>${val}</td>`;
            tbody.appendChild(tr);
        });
    }

    async function loadConfig() {
        const raw = {{.ConfigJSON}};
        const config = {};
        if (raw) {
            Object.keys(raw).forEach(key => {
                if (key.startsWith('_')) return;
                const entry = raw[key];
                config[key] = (entry && typeof entry === 'object' && 'value' in entry) ? entry.value : entry;
            });
        }
        renderTable('config-table', config);
    }

    async function loadSummary() {
        const summary = {{.SummaryJSON}};
        renderTable('summary-table', summary);
    }

    async function loadLogs() {
        const resp = await fetch(`/api/runs/${runID}/logs`);
        const logs = await resp.json();
        const container = document.getElementById('logs-container');
        if (!logs || logs.length === 0) {
            container.textContent = 'No logs.';
            return;
        }
        container.textContent = logs.join('\n');
    }

    const SQL_KEYWORDS = /\b(SELECT|FROM|WHERE|ORDER|BY|LIMIT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|TABLE|INTO|VALUES|SET|AND|OR|NOT|IN|IS|NULL|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|GROUP|HAVING|UNION|ALL|DISTINCT|CASE|WHEN|THEN|ELSE|END|EXISTS|BETWEEN|LIKE|INDEX|PRIMARY|KEY|DEFAULT|REFERENCES|IF|COUNT|SUM|AVG|MIN|MAX|DESC|ASC|CAST|VARCHAR|TEXT|INTEGER|TIMESTAMP|JSON|UNIQUE|OFFSET)\b/gi;

    function highlightSQL(text) {
        let html = text
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/(--.*)/gm, '<span class="sql-comment">$1</span>')
            .replace(/('(?:[^'\\]|\\.)*')/g, '<span class="sql-string">$1</span>')
            .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="sql-number">$1</span>')
            .replace(SQL_KEYWORDS, '<span class="sql-keyword">$1</span>');
        return html + '\n';
    }

    function syncHighlight() {
        const textarea = document.getElementById('sql-input');
        const pre = document.getElementById('sql-highlight');
        pre.innerHTML = highlightSQL(textarea.value);
        pre.scrollTop = textarea.scrollTop;
        pre.scrollLeft = textarea.scrollLeft;
    }

    const sqlInput = document.getElementById('sql-input');
    sqlInput.addEventListener('input', syncHighlight);
    sqlInput.addEventListener('scroll', () => {
        const pre = document.getElementById('sql-highlight');
        pre.scrollTop = sqlInput.scrollTop;
        pre.scrollLeft = sqlInput.scrollLeft;
    });
    syncHighlight();

    function formatCellValue(val) {
        if (val === null) return '<span class="null-val">NULL</span>';
        const s = String(val);
        if ((s.startsWith('{') || s.startsWith('[')) && s.length > 2) {
            try {
                const obj = JSON.parse(s);
                const pretty = JSON.stringify(obj, null, 2);
                const html = pretty
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
                    .replace(/: "((?:[^"\\]|\\.)*)"/g, ': <span class="json-string">"$1"</span>')
                    .replace(/: (-?\d+\.?\d*(?:[eE][+-]?\d+)?)/g, ': <span class="json-number">$1</span>')
                    .replace(/: (true|false)/g, ': <span class="json-bool">$1</span>')
                    .replace(/: (null)/g, ': <span class="json-null">$1</span>');
                return '<pre class="json-cell">' + html + '</pre>';
            } catch {}
        }
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function toggleWrap() {
        const wrap = document.getElementById('query-results');
        const btn = document.getElementById('wrap-toggle-btn');
        wrap.classList.toggle('wrapped');
        btn.classList.toggle('active');
    }

    async function runQuery() {
        const sql = document.getElementById('sql-input').value.trim();
        if (!sql) return;

        const status = document.getElementById('query-status');
        const results = document.getElementById('query-results');
        const btn = document.getElementById('run-query-btn');

        btn.disabled = true;
        status.textContent = 'Running...';
        status.className = 'query-status';
        results.innerHTML = '';

        const start = performance.now();

        try {
            const resp = await fetch('/api/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sql }),
            });
            const data = await resp.json();
            const elapsed = ((performance.now() - start) / 1000).toFixed(2);

            if (data.error) {
                status.textContent = 'Error';
                status.className = 'query-status error';
                results.innerHTML = `<pre class="query-error">${data.error}</pre>`;
                return;
            }

            status.textContent = `${data.rows.length} rows in ${elapsed}s` + (data.truncated ? ' (truncated)' : '');
            status.className = 'query-status success';

            if (data.columns.length === 0) {
                results.innerHTML = '<div class="empty-state">Query returned no columns.</div>';
                return;
            }

            let html = '<div class="query-table-wrap"><table class="query-table"><thead><tr>';
            for (const col of data.columns) {
                html += `<th>${col}</th>`;
            }
            html += '</tr></thead><tbody>';
            for (const row of data.rows) {
                html += '<tr>';
                for (const val of row) {
                    html += `<td>${formatCellValue(val)}</td>`;
                }
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            results.innerHTML = html;
        } catch (e) {
            status.textContent = 'Error';
            status.className = 'query-status error';
            results.innerHTML = `<pre class="query-error">${e.message}</pre>`;
        } finally {
            btn.disabled = false;
        }
    }

    document.getElementById('sql-input').addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            runQuery();
        }
    });

    function heatmapColor(t) {
        const r = Math.round(13 + t * 50);
        const g = Math.round(17 + t * 100);
        const b = Math.round(34 + t * 221);
        return `rgb(${r},${g},${b})`;
    }

    function renderHeatmap(container, key, histData) {
        const steps = histData.map(h => h.step);
        const allBins = histData[0].bins;
        const numBins = allBins.length - 1;

        const wrap = container.querySelector('.heatmap-wrap');
        const canvas = wrap.querySelector('canvas');
        const rect = wrap.getBoundingClientRect();
        const W = rect.width || 400;
        const H = rect.height || 200;
        const padLeft = 40;
        const padBottom = 20;
        const padRight = 4;
        const padTop = 4;
        canvas.width = W * window.devicePixelRatio;
        canvas.height = H * window.devicePixelRatio;
        const ctx = canvas.getContext('2d');
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

        let maxVal = 0;
        for (const h of histData) {
            for (const v of h.values) {
                if (v > maxVal) maxVal = v;
            }
        }
        if (maxVal === 0) maxVal = 1;

        const plotW = W - padLeft - padRight;
        const plotH = H - padTop - padBottom;
        const colW = plotW / histData.length;
        const rowH = plotH / numBins;

        function drawBase() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, W, H);

            for (let col = 0; col < histData.length; col++) {
                const vals = histData[col].values;
                for (let row = 0; row < numBins; row++) {
                    const t = vals[row] / maxVal;
                    ctx.fillStyle = heatmapColor(t);
                    const x = padLeft + col * colW;
                    const y = padTop + (numBins - 1 - row) * rowH;
                    ctx.fillRect(x, y, Math.ceil(colW), Math.ceil(rowH));
                }
            }

            ctx.fillStyle = '#8b949e';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            const xTicks = Math.min(5, steps.length);
            for (let i = 0; i < xTicks; i++) {
                const idx = Math.round(i * (steps.length - 1) / (xTicks - 1 || 1));
                const x = padLeft + (idx + 0.5) * colW;
                const label = steps[idx] >= 1000 ? (steps[idx]/1000).toFixed(0) + 'k' : String(Math.round(steps[idx]));
                ctx.fillText(label, x, H - 2);
            }

            ctx.textAlign = 'right';
            const yTicks = Math.min(5, numBins);
            for (let i = 0; i < yTicks; i++) {
                const binIdx = Math.round(i * (numBins - 1) / (yTicks - 1 || 1));
                const binCenter = (allBins[binIdx] + allBins[binIdx + 1]) / 2;
                const y = padTop + (numBins - 1 - binIdx) * rowH + rowH / 2;
                ctx.fillText(binCenter.toFixed(2), padLeft - 3, y + 3);
            }

            ctx.fillText('Step', padLeft + plotW / 2 + 20, H - 2);
        }

        drawBase();

        let tooltip = container.querySelector('.heatmap-tooltip');
        if (!tooltip) {
            tooltip = document.createElement('div');
            tooltip.className = 'heatmap-tooltip';
            wrap.appendChild(tooltip);
        }

        canvas.addEventListener('mousemove', (e) => {
            const cRect = canvas.getBoundingClientRect();
            const mx = (e.clientX - cRect.left) * (W / cRect.width);
            const colIdx = Math.floor((mx - padLeft) / colW);
            if (colIdx < 0 || colIdx >= histData.length) {
                tooltip.style.display = 'none';
                drawBase();
                return;
            }

            drawBase();

            const lineX = padLeft + (colIdx + 0.5) * colW;
            ctx.strokeStyle = 'rgba(88,166,255,0.6)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(lineX, padTop);
            ctx.lineTo(lineX, padTop + plotH);
            ctx.stroke();

            const hist = histData[colIdx];
            const vals = hist.values;
            const localMax = Math.max(...vals, 1);

            const tw = 140;
            const th = 80;
            const barW = tw / vals.length;

            let tipLeft = e.clientX - cRect.left + 12;
            if (tipLeft + tw + 8 > cRect.width) tipLeft = e.clientX - cRect.left - tw - 12;
            let tipTop = e.clientY - cRect.top - th - 10;
            if (tipTop < 0) tipTop = e.clientY - cRect.top + 12;

            tooltip.style.display = 'block';
            tooltip.style.left = tipLeft + 'px';
            tooltip.style.top = tipTop + 'px';
            tooltip.style.width = tw + 'px';

            const stepLabel = hist.step >= 1000 ? (hist.step/1000).toFixed(1) + 'k' : String(Math.round(hist.step));

            let tipCanvas = tooltip.querySelector('canvas');
            if (!tipCanvas) {
                tipCanvas = document.createElement('canvas');
                tipCanvas.width = tw * 2;
                tipCanvas.height = 50 * 2;
                tipCanvas.style.width = tw + 'px';
                tipCanvas.style.height = '50px';
                tooltip.innerHTML = '';
                tooltip.appendChild(tipCanvas);
                const label = document.createElement('div');
                label.className = 'heatmap-tooltip-label';
                tooltip.appendChild(label);
            }

            const tCtx = tipCanvas.getContext('2d');
            tCtx.setTransform(2, 0, 0, 2, 0, 0);
            tCtx.clearRect(0, 0, tw, 50);

            for (let i = 0; i < vals.length; i++) {
                const barH = (vals[i] / localMax) * 44;
                tCtx.fillStyle = heatmapColor(vals[i] / maxVal);
                tCtx.fillRect(i * barW, 48 - barH, Math.ceil(barW), barH);
            }

            tooltip.querySelector('.heatmap-tooltip-label').textContent = `Step: ${stepLabel}`;
        });

        canvas.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
            drawBase();
        });
    }

    async function loadHistograms() {
        const grid = document.getElementById('chart-grid');
        const histMetrics = {};

        const resp = await fetch(`/api/runs/${runID}/histograms`);
        const text = await resp.text();
        if (!text.trim()) return;

        for (const line of text.split('\n')) {
            if (!line) continue;
            const p = JSON.parse(line);
            if (!histMetrics[p.k]) histMetrics[p.k] = [];
            histMetrics[p.k].push({ step: p.s, bins: p.b, values: p.v });
        }

        const sortedKeys = Object.keys(histMetrics).sort();
        if (sortedKeys.length === 0) return;

        const categories = {};
        for (const key of sortedKeys) {
            const idx = key.indexOf('/');
            const cat = idx === -1 ? 'Charts' : key.substring(0, idx);
            if (!categories[cat]) categories[cat] = [];
            categories[cat].push(key);
        }

        const catOrder = Object.keys(categories).sort((a, b) => {
            if (a === 'Charts') return -1;
            if (b === 'Charts') return 1;
            return a.localeCompare(b);
        });

        for (const cat of catOrder) {
            const keys = categories[cat];
            let section = grid.querySelector(`.category-section[data-cat="${CSS.escape(cat)}"]`);
            let chartsDiv;
            if (section) {
                chartsDiv = section.querySelector('.category-charts');
                const countEl = section.querySelector('.category-count');
                const existing = parseInt(countEl.textContent) || 0;
                countEl.textContent = existing + keys.length;
            } else {
                section = document.createElement('div');
                section.className = 'category-section';
                section.dataset.cat = cat;
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = `<svg class="category-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg><span class="category-name">${cat}</span><span class="category-count">${keys.length}</span>`;
                chartsDiv = document.createElement('div');
                chartsDiv.className = 'category-charts';
                section.appendChild(header);
                section.appendChild(chartsDiv);

                const firstExisting = grid.querySelector('.category-section');
                if (cat === 'Charts' && firstExisting) {
                    grid.insertBefore(section, firstExisting);
                } else {
                    grid.appendChild(section);
                }

                header.addEventListener('click', () => {
                    header.classList.toggle('collapsed');
                    chartsDiv.classList.toggle('hidden');
                });
            }

            for (const key of keys) {
                const data = histMetrics[key].sort((a, b) => a.step - b.step);
                const div = document.createElement('div');
                div.className = 'heatmap-container';
                div.innerHTML = `<div class="heatmap-header"><div class="heatmap-title">${key}</div></div><div class="heatmap-wrap"><canvas></canvas></div>`;
                chartsDiv.appendChild(div);

                requestAnimationFrame(() => renderHeatmap(div, key, data));

                div.addEventListener('click', () => {
                    if (expandedOverlay) return;
                    const overlay = document.createElement('div');
                    overlay.className = 'chart-overlay';
                    const big = document.createElement('div');
                    big.className = 'heatmap-container';
                    big.style.width = '85vw';
                    big.style.maxHeight = '80vh';
                    big.style.cursor = 'default';
                    big.style.borderColor = '#58a6ff';
                    big.innerHTML = `<div class="heatmap-header"><div class="heatmap-title">${key}</div></div><div class="heatmap-wrap" style="height:400px"><canvas></canvas></div>`;
                    overlay.appendChild(big);
                    document.body.appendChild(overlay);
                    expandedOverlay = overlay;
                    requestAnimationFrame(() => renderHeatmap(big, key, data));
                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay) {
                            overlay.remove();
                            expandedOverlay = null;
                        }
                    });
                });
            }
        }
    }

    loadCharts();
    loadHistograms();
    loadConfig();
    loadSummary();
    loadLogs();
    </script>
