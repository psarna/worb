<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>worb</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/worb.svg">
</head>
<body>
    <header>
        <div class="container">
            <h1><img src="/static/worb.svg" alt="" width="28" height="28" style="vertical-align: -4px; margin-right: 6px;"><span>worb</span></h1>
            <a href="https://github.com/psarna/worb" style="color: var(--text-secondary); display: flex;" title="GitHub"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
        </div>
    </header>
    <div class="container">
        <h2>Projects</h2>
        {{if .Projects}}
        {{range .Projects}}
        <a href="/projects/{{.ID}}" style="text-decoration: none; color: inherit;">
            <div class="card" id="project-{{.ID}}">
                <div style="display: flex; align-items: flex-start; justify-content: space-between;">
                    <div>
                        <h3>{{.Name}}</h3>
                        <div class="meta">{{.Entity}} &middot; Created {{.CreatedAt.Format "2006-01-02 15:04"}}</div>
                    </div>
                    <button class="btn-delete" onclick="event.preventDefault(); event.stopPropagation(); deleteProject('{{.ID}}')" title="Delete project"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h12M5.33 4V2.67a1.33 1.33 0 011.34-1.34h2.66a1.33 1.33 0 011.34 1.34V4M12.67 4v9.33a1.33 1.33 0 01-1.34 1.34H4.67a1.33 1.33 0 01-1.34-1.34V4h9.34z"/></svg></button>
                </div>
            </div>
        </a>
        {{end}}
        {{else}}
        <div class="empty-state">
            <p>No projects yet. Start a run to see data here.</p>
            <p style="margin-top: 8px; font-size: 13px;">
                WANDB_BASE_URL=http://{{.Host}}:{{.Port}} WANDB_API_KEY=local wandb.init()
            </p>
        </div>
        {{end}}
    </div>
    <script>
    function deleteProject(projectID) {
        if (!confirm('Delete this project and all its runs? This cannot be undone.')) return;
        fetch('/api/projects/' + projectID, { method: 'DELETE' })
            .then(r => { if (r.ok) { const card = document.getElementById('project-' + projectID); if (card) card.closest('a').remove(); } else return r.text().then(t => { throw new Error(t); }); })
            .catch(e => alert('Failed to delete project: ' + e.message));
    }
    </script>
</body>
</html>
