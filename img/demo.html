<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--text-secondary:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--orange:#db6d28}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 0;margin-bottom:32px}
header .container{display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;font-weight:600}
header h1 span{color:var(--accent)}
.breadcrumb{display:flex;gap:8px;align-items:center;color:var(--text-secondary);margin-bottom:24px;font-size:14px}
h2{font-size:24px;font-weight:600;margin-bottom:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:500}
.badge.finished{background:rgba(88,166,255,0.2);color:var(--accent)}
.badge.running{background:rgba(56,166,80,0.2);color:var(--green)}
.badge.crashed{background:rgba(248,81,73,0.2);color:var(--red)}
.run-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;gap:0}
.tab{padding:8px 16px;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;font-size:14px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.tab-content{display:none}
.tab-content.active{display:block}
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:16px}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chart-title{font-size:14px;color:var(--text-secondary)}
.zoom-reset-btn{background:var(--border);color:var(--text-secondary);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:inherit}
.zoom-reset-btn:hover{color:var(--text);border-color:var(--text-secondary)}
.config-table{width:100%;border-collapse:collapse}
.config-table th,.config-table td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);font-size:14px}
.config-table th{color:var(--text-secondary);font-weight:500;width:200px}
.logs-container{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;font-family:'SF Mono','Fira Code',monospace;font-size:13px;max-height:500px;overflow-y:auto;white-space:pre-wrap;color:var(--text-secondary)}
.empty-state{text-align:center;color:var(--text-secondary);padding:48px 0}
table{width:100%;border-collapse:collapse}
table th,table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px}
table th{color:var(--text-secondary);font-weight:500}
table tr:hover{background:rgba(255,255,255,0.02)}
</style>
</head>
<body>

</header>
<div class="container">
    <div class="breadcrumb">
        <span>Projects</span>
        <span>/</span>
        <span>complex-run</span>
        <span>/</span>
        <span style="color:var(--text)">transformer-training</span>
    </div>
    <div class="run-header">
        <h2 style="margin-bottom:0">transformer-training</h2>
        <span class="badge finished">finished</span>
    </div>
    <div class="tabs">
        <div class="tab active" data-tab="charts">Charts</div>
        <div class="tab" data-tab="config">Config</div>
        <div class="tab" data-tab="summary">Summary</div>
        <div class="tab" data-tab="logs">Logs</div>
    </div>
    <div id="charts" class="tab-content active">
        <div class="chart-grid" id="chart-grid"></div>
    </div>
    <div id="config" class="tab-content">
        <table class="config-table" id="config-table"><tbody></tbody></table>
    </div>
    <div id="summary" class="tab-content">
        <table class="config-table" id="summary-table"><tbody></tbody></table>
    </div>
    <div id="logs" class="tab-content">
        <div class="logs-container" id="logs-container"></div>
    </div>
</div>
<script>
(function() {

document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
    });
});

var allCharts = {};
var syncing = false;

function syncZoom(source, min, max) {
    if (syncing) return;
    syncing = true;
    for (var k in allCharts) {
        var c = allCharts[k];
        var btn = c.canvas.closest('.chart-container').querySelector('.zoom-reset-btn');
        btn.style.display = 'inline-block';
        if (c === source) continue;
        c.zoomScale('x', {min: min, max: max}, 'none');
    }
    syncing = false;
}

function resetAllZoom() {
    for (var k in allCharts) {
        allCharts[k].resetZoom();
        allCharts[k].canvas.closest('.chart-container').querySelector('.zoom-reset-btn').style.display = 'none';
    }
}

function createChart(grid, key, points) {
    var div = document.createElement('div');
    div.className = 'chart-container';
    div.innerHTML = '<div class="chart-header"><div class="chart-title">' + key + '</div><button class="zoom-reset-btn" style="display:none" title="Reset zoom">Reset</button></div><canvas></canvas>';
    grid.appendChild(div);
    var resetBtn = div.querySelector('.zoom-reset-btn');
    var chart = new Chart(div.querySelector('canvas'), {
        type: 'line',
        data: {
            labels: points.map(function(p) { return p.s; }),
            datasets: [{
                label: key,
                data: points.map(function(p) { return p.v; }),
                borderColor: '#58a6ff',
                backgroundColor: 'rgba(88,166,255,0.1)',
                borderWidth: 1.5,
                pointRadius: 0,
                tension: 0.1,
                fill: true
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
                zoom: {
                    zoom: {
                        drag: {
                            enabled: true,
                            backgroundColor: 'rgba(88,166,255,0.15)',
                            borderColor: '#58a6ff',
                            borderWidth: 1
                        },
                        mode: 'x',
                        onZoomComplete: function(ctx) {
                            syncZoom(ctx.chart, ctx.chart.scales.x.min, ctx.chart.scales.x.max);
                        }
                    }
                }
            },
            scales: {
                x: { title: { display: true, text: 'step', color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
                y: { title: { display: true, text: key, color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#30363d' } }
            },
            animation: false
        }
    });
    resetBtn.addEventListener('click', function() { resetAllZoom(); });
    return chart;
}

function renderTable(tableId, obj) {
    var tbody = document.querySelector('#' + tableId + ' tbody');
    if (!obj || Object.keys(obj).length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="color:var(--text-secondary);text-align:center">Empty</td></tr>';
        return;
    }
    Object.keys(obj).sort().forEach(function(key) {
        var tr = document.createElement('tr');
        var val = obj[key];
        if (typeof val === 'object') val = JSON.stringify(val);
        tr.innerHTML = '<th>' + key + '</th><td>' + val + '</td>';
        tbody.appendChild(tr);
    });
}

function seededRandom(seed) {
    var x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

function generateData() {
    var data = {};
    var steps = 500;

    function gen(name, fn) {
        data[name] = [];
        for (var i = 0; i < steps; i++) {
            var step = i * 2;
            var noise = (seededRandom(i * 17 + name.length * 31) - 0.5) * 0.02;
            data[name].push({ s: step, v: fn(i, step, noise) });
        }
    }

    gen('train/loss', function(i, s, n) {
        return 4.5 * Math.exp(-i / 120) + 0.8 + n * (4.5 * Math.exp(-i / 120));
    });
    gen('val/loss', function(i, s, n) {
        return 4.8 * Math.exp(-i / 130) + 0.9 + n * (4.8 * Math.exp(-i / 130)) + (i > 350 ? (i - 350) * 0.0008 : 0);
    });
    gen('train/accuracy', function(i, s, n) {
        return Math.min(0.92, 0.05 + 0.87 * (1 - Math.exp(-i / 100))) + n * 0.3;
    });
    gen('train/perplexity', function(i, s, n) {
        return Math.exp(4.5 * Math.exp(-i / 120) + 0.8 + n * 0.5);
    });
    gen('train/learning_rate', function(i, s, n) {
        if (i < 20) return 3e-4 * (i / 20);
        return 3e-4 * Math.max(0.1, Math.cos(((i - 20) / (steps - 20)) * Math.PI / 2));
    });
    gen('train/grad_norm', function(i, s, n) {
        var base = 2.0 * Math.exp(-i / 200) + 0.5;
        return base + n * base * 3 + (seededRandom(i * 7 + 99) < 0.03 ? seededRandom(i * 13) * 5 : 0);
    });

    for (var layer = 0; layer < 6; layer++) {
        (function(l) {
            gen('norms/layer_' + l, function(i, s, n) {
                var base = 0.5 + l * 0.15 + 0.3 * (1 - Math.exp(-i / 80));
                return base + n * 0.5 + seededRandom(i * (l + 3) * 11) * 0.04;
            });
        })(layer);
    }

    return data;
}

var config = {
    batch_size: 64,
    d_model: 512,
    dropout: 0.1,
    epochs: 10,
    learning_rate: 0.0003,
    max_seq_len: 256,
    n_heads: 8,
    n_layers: 6,
    optimizer: "adamw",
    vocab_size: 32000,
    warmup_steps: 40,
    weight_decay: 0.01
};

var summary = {
    best_val_loss: 1.142,
    final_train_accuracy: 0.891,
    final_train_loss: 0.923,
    total_steps: 998,
    training_time_seconds: 3847.2
};

var logs = [
    "Initializing transformer model with 6 layers, 512 d_model, 8 heads",
    "Model parameters: 38,412,800",
    "Loading dataset: wikitext-103-raw-v1",
    "Tokenizer: BPE with vocab_size=32000",
    "Training on 1x NVIDIA A100 80GB",
    "Step 0 | loss: 10.372 | lr: 0.000000 | grad_norm: 12.451",
    "Step 50 | loss: 6.891 | lr: 0.000225 | grad_norm: 3.217",
    "Step 100 | loss: 4.234 | lr: 0.000300 | grad_norm: 1.854",
    "Step 150 | loss: 3.102 | lr: 0.000296 | grad_norm: 1.423",
    "Step 200 | loss: 2.451 | lr: 0.000284 | grad_norm: 1.102",
    "Validation @ step 200 | val_loss: 2.892",
    "Step 250 | loss: 1.987 | lr: 0.000267 | grad_norm: 0.934",
    "Step 300 | loss: 1.654 | lr: 0.000245 | grad_norm: 0.812",
    "Step 350 | loss: 1.342 | lr: 0.000219 | grad_norm: 0.743",
    "Validation @ step 400 | val_loss: 1.487",
    "Step 400 | loss: 1.187 | lr: 0.000190 | grad_norm: 0.698",
    "Step 450 | loss: 1.054 | lr: 0.000159 | grad_norm: 0.671",
    "Step 500 | loss: 0.987 | lr: 0.000127 | grad_norm: 0.654",
    "Validation @ step 600 | val_loss: 1.198",
    "Step 550 | loss: 0.963 | lr: 0.000095 | grad_norm: 0.642",
    "Step 600 | loss: 0.945 | lr: 0.000065 | grad_norm: 0.631",
    "Step 650 | loss: 0.934 | lr: 0.000039 | grad_norm: 0.628",
    "Validation @ step 800 | val_loss: 1.142",
    "Step 700 | loss: 0.928 | lr: 0.000030 | grad_norm: 0.625",
    "Training complete. Best val_loss: 1.142 at step 800",
    "Model saved to checkpoints/best_model.pt"
];

var grid = document.getElementById('chart-grid');
var chartData = generateData();
var chartOrder = ['train/loss', 'val/loss', 'train/accuracy', 'train/perplexity', 'train/learning_rate', 'train/grad_norm',
    'norms/layer_0', 'norms/layer_1', 'norms/layer_2', 'norms/layer_3', 'norms/layer_4', 'norms/layer_5'];
chartOrder.forEach(function(key) {
    if (chartData[key]) {
        allCharts[key] = createChart(grid, key, chartData[key]);
    }
});

renderTable('config-table', config);
renderTable('summary-table', summary);
document.getElementById('logs-container').textContent = logs.join('\n');

})();
</script>
</body>
</html>
